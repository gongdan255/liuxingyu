<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010203">
<meta name="description" content="在流星雨中许一个愿，让心事变成夜空里的一颗星。">
<title>流星雨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23080c1c'/%3E%3Cpath d='M20 5L23 17L35 20L23 23L20 35L17 23L5 20L17 17Z' fill='%23e6d3a3'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8e7ee;background:#010203}
*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e6cda0;outline-offset:5px}
.sky{position:fixed;inset:0;background:linear-gradient(#000000,#010203 70%,#020305)}
.nebula{display:none}
canvas{position:absolute;inset:0;width:100%;height:100%}header{position:fixed;left:0;right:0;top:max(34px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;padding:0 48px;pointer-events:none}.brand{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:4px}.brand svg{color:#d6bd87}.edition{font-size:10px;letter-spacing:3px;color:#777f94}.intro{position:fixed;top:17%;width:100%;text-align:center;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:7px;color:#aa9670;margin:0 0 22px}h1{font-family:"Songti SC","SimSun",serif;font-weight:400;font-size:clamp(32px,4vw,48px);letter-spacing:.35em;margin:0 0 22px;padding-left:.35em}.intro p:last-child{font-size:12px;letter-spacing:4px;color:#9299aa}
.bottom{position:fixed;bottom:max(32px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 48px));text-align:center}.hint{font-size:11px;letter-spacing:2px;color:#8790a4;margin-bottom:20px;min-height:16px}form{display:flex;gap:6px;align-items:center;border:1px solid #ffffff26;background:#0b0d11b3;box-shadow:none;border-radius:24px;padding:3px 5px 3px 16px;backdrop-filter:blur(12px)}input{min-width:0;flex:1;border:0;background:transparent;outline:none;color:#e0e5ee;font-size:12px;letter-spacing:.5px;padding:8px 0}input::placeholder{color:#788196}form:focus-within{border-color:#cfddff66}form button{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border:0;background:transparent;color:#d6deeb;border-radius:50%;padding:0;font-size:20px;transition:background .2s,transform .2s}form button:hover{background:#ffffff12;transform:translateY(-1px)}.footnote{color:#5e6a80;font-size:10px;letter-spacing:2px;margin:17px 0 0}.star-layer{position:fixed;inset:0;pointer-events:none}.wish-star{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:42px;height:42px;border:0;background:transparent;color:rgb(207,221,255);padding:0;animation:arrive 1s ease-out}.wish-star::before{content:"";position:absolute;left:50%;top:50%;width:3.6px;height:3.6px;transform:translate(-50%,-50%);border-radius:50%;background:rgb(207,221,255);opacity:1;box-shadow:0 0 5px 1px #cfddff99,0 0 12px 3px #cfddff28;animation:wishTwinkle 4s ease-in-out infinite}.wish-star::after{content:none}.wish-star:hover::before,.wish-star:focus-visible::before{box-shadow:0 0 6px 2px #cfddffbb,0 0 15px 4px #cfddff45}.popover{position:fixed;z-index:5;width:min(290px,calc(100vw - 32px));transform:translateX(-50%);padding:22px 28px;background:#141c2eed;border:1px solid #c1ad813d;border-radius:16px;box-shadow:0 12px 60px #0007;backdrop-filter:blur(16px);text-align:center}.popover[hidden]{display:none}.popover small{font-size:10px;letter-spacing:3px;color:#ccb98f}.popover p{font-family:"Songti SC","SimSun",serif;font-size:17px;line-height:1.8;overflow-wrap:anywhere;margin:13px 0 5px}.close{position:absolute;top:4px;right:7px;background:none;border:0;color:#a1a9ba;font-size:20px;padding:4px 8px}.toast{position:fixed;top:34%;left:50%;transform:translate(-50%,8px);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;text-align:center;color:#e5d3ad;font-size:13px;letter-spacing:3px;width:90%}.toast.show{opacity:1;transform:translate(-50%,0)}.pause{position:fixed;right:32px;bottom:34px;border:1px solid #ffffff18;background:#10172799;color:#8792a8;border-radius:22px;padding:9px 14px;font-size:11px}.land{position:absolute;bottom:0;width:100%;height:12%;background:#000;clip-path:polygon(0 70%,4% 57%,9% 68%,14% 41%,18% 50%,25% 24%,32% 47%,38% 40%,46% 72%,54% 58%,62% 72%,70% 40%,74% 48%,83% 20%,89% 48%,93% 36%,100% 60%,100% 100%,0 100%);opacity:.75}
@keyframes wishTwinkle{50%{opacity:.84}}@keyframes arrive{from{opacity:0;transform:translate(-50%,-50%) scale(1.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:650px){header{padding:0 23px;top:27px}.edition{font-size:8px;letter-spacing:2px}.brand{font-size:12px}.intro{top:16%}.eyebrow{font-size:8px;letter-spacing:5px}h1{font-size:33px}.intro p:last-child{font-size:10px;letter-spacing:3px}.bottom{bottom:max(28px,env(safe-area-inset-bottom))}.pause{top:75px;right:22px;bottom:auto;padding:7px 10px;font-size:10px}form{padding-left:14px;gap:4px}.footnote{font-size:9px;letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){.wish-star,.wish-star::before{animation:none}}
.hint,.footnote{display:none}.toast{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.pause{width:40px;height:40px;padding:0;display:grid;place-items:center}.pause svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="nebula"></div><canvas id="sky"></canvas><div class="land"></div></div>
<main><div class="star-layer" id="wishes" aria-label="愿望星星"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="bottom"><div class="hint" id="hint">每一个愿望，都值得一颗星星</div><form id="form"><input id="wish" aria-label="写下你的愿望" placeholder="写下你的愿望…" maxlength="120" autocomplete="off" required><button type="submit" aria-label="放飞心愿" title="放飞心愿"><span aria-hidden="true">↗</span></button></form><p class="footnote">点击星星，重温心愿 · 愿望保存在这台设备上</p></div>
<aside class="popover" id="popover" hidden aria-label="星星中的愿望"><button class="close" aria-label="关闭愿望">×</button><small>属于你的那一颗星</small><p id="wish-text"></p></aside>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('#sky'), ctx = canvas.getContext('2d');
  const layer = document.querySelector('#wishes'), form = document.querySelector('#form'), input = document.querySelector('#wish');
  const popover = document.querySelector('#popover');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=innerWidth,h=innerHeight,stars=[],meteors=[],flights=[],last=0,elapsed=0,spawn=0,paused=reduced,toastTimer;
  let wishes=[];
  try {const saved=JSON.parse(localStorage.getItem('star-river-wishes-v1')||'[]');if(Array.isArray(saved))wishes=saved.filter(a=>a&&typeof a.text==='string'&&Number.isFinite(a.x)&&Number.isFinite(a.y)).map(a=>({...a,text:a.text.slice(0,120),x:Math.max(.08,Math.min(.92,a.x)),y:Math.max(.36,Math.min(.72,a.y))}));}catch{}
  const rand=(a,b)=>a+Math.random()*(b-a);
  function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(420,Math.round(w*h/4000))},()=>({x:Math.random()*w,y:Math.random()*h,r:rand(.35,1.05),p:rand(0,Math.PI*2),speed:rand(.4,1.2)}));popover.hidden=true;}
  function meteor(initial=false){const speed=rand(220,530);return {x:rand(-w*.1,w*1.4),y:initial?rand(-h*.25,h*.8):rand(-h*.3,h*.25),vx:-speed*.75,vy:speed*.66,len:rand(75,210),life:0,max:rand(1.7,3.2),alpha:rand(.25,.9),width:rand(1.2,2.6)};}
  function streak(x,y,dx,dy,len,alpha,width,color){const g=ctx.createLinearGradient(x,y,x+dx*len,y+dy*len);g.addColorStop(0,`rgba(${color},${alpha})`);g.addColorStop(.15,`rgba(${color},${alpha*.65})`);g.addColorStop(1,`rgba(${color},0)`);ctx.strokeStyle=g;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*len,y+dy*len);ctx.stroke();ctx.fillStyle=`rgba(${color},${alpha})`;ctx.shadowColor=`rgb(${color})`;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,width*1.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
  function render(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(!paused)elapsed+=dt;ctx.clearRect(0,0,w,h);
    for(const s of stars){const a=.14+(Math.sin(elapsed*s.speed+s.p)+1)*.21;ctx.fillStyle=`rgba(207,221,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
    if(!paused){spawn+=dt;while(spawn>.07){meteors.push(meteor());spawn-=.07;}for(const m of meteors){m.x+=m.vx*dt;m.y+=m.vy*dt;m.life+=dt;}meteors=meteors.filter(m=>m.life<m.max&&m.x>-250&&m.y<h+250);}
    for(const m of meteors){const fade=Math.min(m.life*3,1,(m.max-m.life)*2);streak(m.x,m.y,.75,-.66,m.len,Math.max(0,fade)*m.alpha,m.width,'218,230,255');}
    for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.t+=dt;const p=Math.min(f.t/1.65,1),e=1-Math.pow(1-p,3);const x=f.sx+(f.item.x*w-f.sx)*e+Math.sin(p*Math.PI)*45,y=f.sy+(f.item.y*h-f.sy)*e;streak(x,y,-.2,1,85*(1-p)+10,1,1.2,'207,221,255');if(p===1){addStar(f.item);flights.splice(i,1);notify('你的愿望，已经在星河里闪耀');}}
    requestAnimationFrame(render);
  }
  function notify(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);}
  function updateCount(){document.querySelector('#hint').textContent=wishes.length?`这片星空，已经珍藏了 ${wishes.length} 个心愿`:'每一个愿望，都值得一颗星星';}
  function addStar(item){const b=document.createElement('button');b.className='wish-star';b.style.left=item.x*100+'%';b.style.top=item.y*100+'%';b.style.animationDelay='0s';b.setAttribute('aria-label','查看愿望：'+item.text);b.addEventListener('click',()=>{document.querySelector('#wish-text').textContent=item.text;popover.hidden=false;const r=b.getBoundingClientRect();const half=popover.offsetWidth/2;popover.style.left=Math.max(half+16,Math.min(w-half-16,r.x+r.width/2))+'px';popover.style.top=Math.max(16,Math.min(h-popover.offsetHeight-110,r.bottom+12))+'px';});layer.appendChild(b);}
  form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){input.value='';input.focus();return;}let point;for(let i=0;i<30;i++){point={x:rand(.09,.91),y:rand(.37,.70)};if(wishes.every(a=>Math.hypot((a.x-point.x)*w,(a.y-point.y)*h)>48))break;}const item={text,...point};wishes.push(item);let stored=true;try{localStorage.setItem('star-river-wishes-v1',JSON.stringify(wishes));}catch{stored=false;}const r=input.getBoundingClientRect();input.value='';input.blur();popover.hidden=true;updateCount();if(reduced){addStar(item);notify('你的愿望，已经在星河里闪耀');}else flights.push({item,sx:r.x+r.width*.5,sy:r.y,t:0});if(!stored){document.querySelector('.footnote').style.display='block';document.querySelector('.footnote').textContent='当前浏览器无法保存愿望，请保持此页面打开';}});
  document.querySelector('.close').addEventListener('click',()=>{popover.hidden=true;});document.addEventListener('keydown',e=>{if(e.key==='Escape')popover.hidden=true;});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.wish-star,.popover'))popover.hidden=true;});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});window.addEventListener('resize',resize);resize();for(let i=0;i<32;i++){const m=meteor(true);m.life=rand(.3,1);meteors.push(m);}wishes.forEach(addStar);updateCount();requestAnimationFrame(render);
})();
</script>
</body>
</html>
